name: Test and analyze BlockData virion

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate BlockData virion
    runs-on: ubuntu-24.04

    steps:
      - name: Check out BlockData
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP with Axolotl-PM
        uses: axolotl-pm/setup-php-action@b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
        with:
          php-version: "8.1"
          pm-version-major: "5"
          install-path: ./.php-bin

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install locked development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins

      - name: Check source style
        run: composer lint

      - name: Analyze source at PHPStan level max
        run: composer phpstan

      - name: Test LevelDB persistence and failed flush handling
        run: composer test

      - name: Lint PHP sources
        shell: bash
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate virion manifest
        shell: bash
        run: |
          php -r '
            $manifest = yaml_parse_file("virion.yml");
            if (!is_array($manifest) || ($manifest["name"] ?? null) !== "BlockData" || ($manifest["antigen"] ?? null) !== "NhanAZ\\BlockData") {
                fwrite(STDERR, "Invalid BlockData virion.yml\n");
                exit(1);
            }
            echo "BlockData virion manifest is valid.\n";
          '
