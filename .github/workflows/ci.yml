name: Validate

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate BlockData virion
    runs-on: ubuntu-24.04

    steps:
      - name: Check out BlockData
        uses: actions/checkout@v7.0.1

      - name: Check out Axolotl PHP setup helper
        uses: actions/checkout@v7.0.1
        with:
          repository: axolotl-pm/setup-php-action
          ref: b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
          path: .devtools-dependencies/setup-php-action
          persist-credentials: false

      - name: Set up Axolotl PHP on Node.js 24
        shell: bash
        env:
          INPUT_PHP-VERSION: "8.1"
          INPUT_PM-VERSION-MAJOR: "5"
          INPUT_INSTALL-PATH: ./.php-bin
        run: node "$GITHUB_WORKSPACE/.devtools-dependencies/setup-php-action/dist/index.js"

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install locked development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins

      - name: Check source style
        run: composer lint

      - name: Analyze source at PHPStan level max
        run: composer phpstan

      - name: Test LevelDB persistence and failed flush handling
        run: composer test

      - name: Lint PHP sources
        shell: bash
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate virion manifest
        shell: bash
        run: |
          php -r '
            $manifest = yaml_parse_file("virion.yml");
            if (!is_array($manifest) || ($manifest["name"] ?? null) !== "BlockData" || ($manifest["antigen"] ?? null) !== "NhanAZ\\BlockData") {
                fwrite(STDERR, "Invalid BlockData virion.yml\n");
                exit(1);
            }
            echo "BlockData virion manifest is valid.\n";
          '
